name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, no leading v (e.g. 0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the tag name
        id: vars
        run: |
          version="${{ inputs.version }}"
          tag_name="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Build the changelog since the previous tag
        run: |
          prev_tag=$(git tag --sort=-v:refname | grep -vx "${{ steps.vars.outputs.tag_name }}" | head -n1 || true)
          if [ -z "${prev_tag}" ]; then
            echo "## Changes" > changelog.md
            git log --pretty=format:"- %s (%h)" >> changelog.md
          else
            echo "## Changes since ${prev_tag}" > changelog.md
            git log "${prev_tag}"..HEAD --pretty=format:"- %s (%h)" >> changelog.md
          fi
          echo >> changelog.md

      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.md

      # Tags are authored on the Forgejo origin and reach GitHub through the push
      # mirror, which prunes refs it does not have. Reuse an existing tag rather
      # than recreating it, or the next mirror sync will delete it.
      - name: Create the release tag if it does not already exist
        run: |
          tag_name="${{ steps.vars.outputs.tag_name }}"
          if git rev-parse "${tag_name}" >/dev/null 2>&1; then
            echo "Tag ${tag_name} already exists; using it as-is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag_name}" -m "Release ${tag_name}"
          git push origin "${tag_name}"

  build:
    runs-on: ubuntu-latest
    needs: tag
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${{ needs.tag.outputs.version }}"
          out="futurelearn-downloader-v${version}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${out}" dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags "-X main.version=${version}" -o "${out}/futurelearn-downloader.exe" .
            (cd "${out}" && zip "../dist/${out}.zip" futurelearn-downloader.exe)
          else
            go build -ldflags "-X main.version=${version}" -o "${out}/futurelearn-downloader" .
            tar -czf "dist/${out}.tar.gz" -C "${out}" futurelearn-downloader
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: [tag, build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - uses: actions/download-artifact@v4
        with:
          pattern: release-binaries-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag_name }}
          name: ${{ needs.tag.outputs.tag_name }}
          body_path: changelog.md
          files: dist/*
