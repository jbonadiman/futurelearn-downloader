[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futurelearn-downloader"
version = "0.2.2"
description = "Download a FutureLearn course you're enrolled in to a local folder tree (Markdown + media)"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
authors = [{ name = "greenteafox" }]
keywords = ["futurelearn", "downloader", "scraper", "offline", "course"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "curl_cffi>=0.6",
    "markdownify>=0.11",
]

[project.scripts]
futurelearn = "futurelearn_downloader.scrape:main"

[tool.hatch.build.targets.wheel]
packages = ["src/futurelearn_downloader"]
